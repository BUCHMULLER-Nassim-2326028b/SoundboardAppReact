<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#0d9488"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#080e29"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" rx="36" fill="url(#bg)"/>
  <rect width="600" height="900" rx="36" fill="url(#glow)"/>
  
  <!-- Geometric accents -->
  <circle cx="500" cy="150" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="100" cy="750" r="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Display Title TEST / BIENVENUE -->
  <g transform="translate(300, 460)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="110" 
          letter-spacing="4" 
          fill="#ffffff" 
          text-anchor="middle" 
          dominant-baseline="middle"
          filter="drop-shadow(0 4px 16px rgba(0,0,0,0.5))">
      TEST
    </text>
  </g>
  
  <!-- Subtle Badge -->
  <g transform="translate(300, 560)">
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">NOUVEAU</text>
  </g>
</svg>
