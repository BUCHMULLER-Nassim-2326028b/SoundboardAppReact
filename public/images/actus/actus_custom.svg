<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_purple" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#08071a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="36" fill="url(#bg_purple)"/>

  <!-- Waveform / Equalizer Visual Motif -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <!-- Center Audio Upload Icon -->
    <circle cx="0" cy="0" r="70" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Upload Arrow / Plus -->
    <path d="M-20,10 L0,-15 L20,10 M0,-15 L0,25" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Big Display Text -->
  <g transform="translate(300, 560)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="4" 
          fill="#ffffff" 
          text-anchor="middle" 
          dominant-baseline="middle"
          filter="drop-shadow(0 4px 16px rgba(0,0,0,0.6))">
      CUSTOM
    </text>
  </g>

  <!-- Tag -->
  <g transform="translate(300, 640)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">SLOTS DE SONS</text>
  </g>
</svg>
