<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_red" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="36" fill="url(#bg_red)"/>
  
  <!-- Subtle circular rings -->
  <circle cx="300" cy="380" r="160" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="300" cy="380" r="230" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Stylized Maskass Mask Motif -->
  <g transform="translate(300, 340)">
    <!-- White Mask Base -->
    <ellipse cx="0" cy="0" rx="100" ry="120" fill="#ffffff" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.5))"/>
    <!-- Black Eyes -->
    <ellipse cx="-40" cy="-20" rx="20" ry="32" fill="#18181b"/>
    <ellipse cx="40" cy="-20" rx="20" ry="32" fill="#18181b"/>
    <!-- Black Mouth -->
    <circle cx="0" cy="50" r="24" fill="#18181b"/>
    <!-- Strap -->
    <rect x="-105" y="-30" width="10" height="20" rx="4" fill="#71717a"/>
    <rect x="95" y="-30" width="10" height="20" rx="4" fill="#71717a"/>
  </g>

  <!-- Big Display Text -->
  <g transform="translate(300, 560)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="4" 
          fill="#ffffff" 
          text-anchor="middle" 
          dominant-baseline="middle"
          filter="drop-shadow(0 4px 16px rgba(0,0,0,0.6))">
      MASKASS
    </text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(300, 640)">
    <rect x="-100" y="-18" width="200" height="36" rx="18" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">NOUVELLE CATÉGORIE</text>
  </g>
</svg>
