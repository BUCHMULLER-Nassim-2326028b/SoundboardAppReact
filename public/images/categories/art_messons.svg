<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_custom_art" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="mic_glow_art" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.45)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="344" height="380" fill="url(#bg_custom_art)"/>
  <rect width="344" height="380" fill="url(#mic_glow_art)"/>

  <!-- Decorative rings -->
  <circle cx="172" cy="190" r="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="172" cy="190" r="78" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Custom Sound / Microphone / Plus Motif -->
  <g transform="translate(172, 190)">
    <rect x="-26" y="-60" width="52" height="80" rx="26" fill="#ffffff" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.5))"/>
    <path d="M-38,-12 C-38,32 38,32 38,-12" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="60" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- Plus Badge -->
    <circle cx="30" cy="-38" r="20" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
    <line x1="30" y1="-47" x2="30" y2="-29" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="21" y1="-38" x2="39" y2="-38" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
