<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_all_art" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="star_glow_art" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(250, 204, 21, 0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="344" height="380" fill="url(#bg_all_art)"/>
  <rect width="344" height="380" fill="url(#star_glow_art)"/>

  <!-- Decorative rings -->
  <circle cx="172" cy="190" r="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="172" cy="190" r="78" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Golden Sound / Star / All Motif -->
  <g transform="translate(172, 190)">
    <polygon points="0,-72 20,-20 72,-20 30,15 46,68 0,36 -46,68 -30,15 -72,-20 -20,-20" 
             fill="#facc15" 
             stroke="#ca8a04" 
             stroke-width="3"
             filter="drop-shadow(0 6px 18px rgba(0,0,0,0.6))"/>
    <path d="M-15,-12 L-5,-12 L8,-22 L8,22 L-5,12 L-15,12 Z" fill="#1e3a8a"/>
    <path d="M14,-10 C18,-5 18,5 14,10" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <path d="M20,-18 C27,-8 27,8 20,18" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
